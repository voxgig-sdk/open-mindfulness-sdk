    PanchaVikasResourceListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/PanchaVikasResource'
        meta:
          $ref: '#/components/schemas/Meta'
    Resource:
      type: object
      description: >
        The common normalized shape used by /v1/resources and /v1/search across all 7
        families. Fields not applicable to a given resource's type are null rather than
        fabricated. `id` is populated for every resource, using each family's existing
        stable public identifier where one already exists (mindfulness_game uses its
        `MG-*` api_id, guided_practice uses its `SL-*` track_id, podcast_episode uses
        its `PC-S01E01-EN` id, panchavikas_* uses its `PV-*` id), or a deterministic `type:slug` pair otherwise (e.g. `blog:<slug>`,
        `research:<slug>`, `glossary:<slug>`) — never a raw Sanity `_id`. `slug` is
        populated for every type except panchavikas_pathway/panchavikas_download, which
        have no real slug field and are always null there. A blog-type resource still
        always has `category` set to null (unlike id/slug, which changed 2026-09-25 —
        see HANDOFF.md), matching the fact that blog posts have no equivalent taxonomy
        field exposed elsewhere in this API. Note this Resource shape (used only by
        /v1/resources and /v1/search) is intentionally richer than the dedicated
        /v1/blog endpoint's own response, which still omits id/slug/type/updated_at
        entirely per Mohan's original instruction for that endpoint specifically.
      properties:
        id:
          type: string
        title:
          type: string
        slug:
          type: string
          nullable: true
        type:
          type: string
          enum: [blog, mindfulness_game, guided_practice, research, glossary, podcast_episode, panchavikas_pathway, panchavikas_download]
        summary:
          type: string
          nullable: true
        category:
          type: string
          nullable: true
        tags:
          type: array
          nullable: true
          items:
            type: string
        audiences:
          type: array
          nullable: true
          items:
            type: string
        age_min:
          type: integer
          nullable: true
        age_max:
          type: integer
          nullable: true
        duration_minutes:
          type: integer
          nullable: true
        skills:
          type: array
          nullable: true
          items:
            type: string
        access:
          type: string
          nullable: true
          description: e.g. "free". Never "paid" — no paid content is ever exposed by this API.
        source_url:
          type: string
        updated_at:
          type: string
          format: date-time
          nullable: true
      example:
        id: "MG-001"
        title: "Breathing Buddy"
        slug: "breathing-buddy"
        type: "mindfulness_game"
        summary: "A gentle breathing pacer for young children."
        category: "Breathing"
        tags: ["breathing", "calm", "kids"]
        audiences: ["children"]
        age_min: 5
        age_max: 12
        duration_minutes: 5
        skills: ["breathwork"]
        access: "free"
        source_url: "https://www.theholisticcare.com/games/breathing-buddy.html"
        updated_at: "2026-09-24T00:00:00.000Z"
    ResourceListResponse:
      type: object
